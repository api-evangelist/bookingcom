description: 'FOCUS-aligned FinOps for Booking.com partner APIs: an affiliate / connectivity model where
  approved partners pay no per-request fee but settle commercials on commission share from confirmed stays
  or contracted connectivity terms.'
sources:
  - https://developers.booking.com/
  - https://legacy.developers.booking.com/api
notes: No public pricing; commercial model is partner agreement and commission share, not metered API
  spend. Reconcile once partner agreement terms are in scope.
billingModel:
  pricingCategory: Commission / Partner Agreement
  billingFrequency: Monthly
  billingCurrency: USD/EUR/GBP
  chargeCategories:
    - Adjustment
    - Credit
    - Tax
focusColumns:
  ServiceName: Booking.com
  ServiceCategory: Travel & Hospitality
  ProviderName: Booking.com
  PublisherName: Booking.com B.V.
  InvoiceIssuerName: Booking.com B.V.
  BillingCurrency: EUR
  PricingCategory: Other
  PricingUnit: completed-stay
meters:
  - name: completed_stays
    description: Number of completed bookings attributed to the affiliate / partner channel.
    unit: stay
    aggregation: sum
    dimensions:
      - partner
      - market
      - property_type
  - name: booking_value
    description: Gross booking value of completed stays, used as the commission base.
    unit: currency
    aggregation: sum
    dimensions:
      - partner
      - currency
      - market
  - name: api_requests
    description: Demand / Connectivity API request volume; used for capacity and fair-use review rather
      than direct billing.
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - partner
principles:
  - name: Visibility
    description: Reconcile completed-stay reports and commission statements from the Booking.com Partner
      Hub against your internal booking and traffic data.
  - name: Allocation
    description: Tag affiliate traffic with campaign / property / market so commission revenue and any
      contracted connectivity costs allocate cleanly to product lines.
  - name: Optimization
    description: Tune affiliate placements toward higher-converting markets and property types; cache search
      results within partner-allowed TTLs to reduce Demand API load.
  - name: Accountability
    description: Assign a partner-relationship owner; review monthly statements, dispute discrepancies
      against booking and stay data, and track commission share against renewal targets.
