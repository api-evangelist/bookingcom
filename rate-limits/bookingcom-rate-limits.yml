description: Booking.com does not publish per-second or per-minute API rate limits on its public developer
  site; rate-limit terms are communicated to certified Connectivity and Demand API partners under contract.
  Consumers should expect HTTP 429 throttling on overuse and apply exponential backoff. Reconcile against
  the partner-specific technical specification once available.
sources:
  - https://developers.booking.com/
  - https://legacy.developers.booking.com/api
notes: Rate limits are not publicly published; values are partner-specific and conveyed via Connectivity
  / Demand API technical onboarding documents.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Demand API request rate
    scope: partner
    metric: varies
    limit: 'see partner technical specification'
    notes: Per-partner negotiated; not publicly published.
  - name: Connectivity API request rate
    scope: partner
    metric: varies
    limit: 'see partner technical specification'
    notes: Per-partner negotiated; not publicly published.
policies:
  - name: Backoff Strategy
    description: Apply exponential backoff with jitter on 429 and 5xx responses; honor Retry-After when
      present.
  - name: Partner-Bound Quotas
    description: Effective request budget is set in the partner contract and onboarding spec, not via a
      public tier page.
  - name: Fair Use
    description: Sustained traffic that materially impacts shared infrastructure is reviewed and may trigger
      throttling regardless of contract.
maintainers:
