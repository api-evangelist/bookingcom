description: Booking.com APIs (Demand API, Connectivity API, Affiliate Partner Programme) are not sold
  on a self-service pricing page. Access is granted to vetted partners through the Booking.com Partner
  Hub and Affiliate Partner Programme; affiliates are compensated on a commission basis from confirmed
  stays rather than paying per request. Replace with negotiated terms once partner contract details are
  available.
sources:
  - https://developers.booking.com/
  - https://legacy.developers.booking.com/api
notes: No public pricing page; access is partner-gated. Affiliate Partner Programme operates on commission
  share from completed stays, not per-request fees. Reconcile against partner contract terms.
plans:
  - id: bookingcom-affiliate-partner
    name: Affiliate Partner Programme
    type: enterprise
    description: Commission-based access to Booking.com inventory and Demand API for approved affiliates.
    entries:
      - label: Demand API access
        name: demand_api_access
        type: quota
        metric: request
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see partner agreement
        userMultiplied: false
      - label: Affiliate commission
        name: affiliate_commission
        type: metered
        metric: completed-stay
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: commission share - see partner agreement
        userMultiplied: false
    elements:
      - name: Demand API
      - name: Booking.com Affiliate Partner Programme
      - name: Partner Hub Access
  - id: bookingcom-connectivity-partner
    name: Connectivity Partner Programme
    type: enterprise
    description: Channel-manager and PMS partners integrate properties via the Connectivity API; certification
      and contract required.
    entries:
      - label: Connectivity API access
        name: connectivity_api_access
        type: quota
        metric: request
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see partner agreement
        userMultiplied: false
    elements:
      - name: Connectivity API
      - name: Property Onboarding
      - name: Certification Programme
