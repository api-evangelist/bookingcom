naftiko: 1.0.0-alpha2
info:
  label: Booking.com API
  description: Booking.com provides APIs for hotel search, availability, rates, reservations, and property management. The
    Connectivity APIs enable partners to distribute and manage accommodation inventory.
  tags:
  - Bookingcom
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: bookingcom
    baseUri: https://api.booking.com
    description: Booking.com API HTTP API.
    authentication:
      type: bearer
      token: '{{BOOKINGCOM_TOKEN}}'
    resources:
    - name: status
      path: /status
      operations:
      - name: getstatus
        method: GET
        description: Get API status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: bookingcom-rest
    description: REST adapter for Booking.com API.
    resources:
    - path: /status
      name: getstatus
      operations:
      - method: GET
        name: getstatus
        description: Get API status
        call: bookingcom.getstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: bookingcom-mcp
    transport: http
    description: MCP adapter for Booking.com API for AI agent use.
    tools:
    - name: getstatus
      description: Get API status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bookingcom.getstatus
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    BOOKINGCOM_TOKEN: BOOKINGCOM_TOKEN
